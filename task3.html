<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Bootstrap Validation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="task1.html">HTML5 Validation</a>
        <a href="task2.html">Bootstrap Form</a>
        <a href="task3.html">Bootstrap Validation</a>
        <a href="task4.html">Registration</a>
    </nav>

    <div class="container mt-5">

        <div class="card p-4 shadow">

            <h1 class="text-center mb-4">Bootstrap Validation Form</h1>

            <form>

                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>

                    <input
                        type="text"
                        class="form-control is-valid"
                        id="name"
                        value="Kuralay"
                    >

                    <div class="valid-feedback">
                        Looks good!
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>

                    <input
                        type="email"
                        class="form-control is-invalid"
                        id="email"
                    >

                    <div class="invalid-feedback">
                        Email is required.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>

                    <textarea
                        class="form-control is-valid"
                        id="message"
                        rows="5"
                    >Hello!</textarea>

                    <div class="valid-feedback">
                        Message looks good!
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    Submit
                </button>

            </form>

        </div>

    </div>

</body>
</html>
