<body>

        <a href="task3.html">Bootstrap Validation</a>

    <div class="form-container">

        <h1>Contact Form with Validation</h1>
        <p>Please fill in all required fields.</p>

        <form>

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                required
                maxlength="50"
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                rows="5"
                required
                maxlength="200"
            ></textarea>

            <button type="submit">Submit</button>

        </form>

    </div>

</body>
</html>
